<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Immo Finanz Pilot – in Entwicklung</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
  :root{--bg:#FFFFFF;--text:#1A1A1A;--gold:#A8841F;--gold-text:#8A6D1F;--muted:#5F5F5F}
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       padding:32px 20px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}

<body>
  <img src="assets/logo.svg" alt="Immo Finanz Pilot">
  <h1>Objekt-Check &amp; Bank-Pitch für Kapitalanleger</h1>
